  <!-- y --><text class="letter l3" x="363" y="102">y</text>
  <!-- M --><text class="letter l4" x="418" y="102">M</text>
  <!-- o --><text class="letter l5" x="470" y="102">o</text>
  <!-- D --><text class="letter l6" x="513" y="102">D</text>
  <!-- E --><text class="letter l7" x="559" y="102">E</text>
  <!-- l --><text class="letter l8" x="600" y="102">l</text>
  <!-- s --><text class="letter l9" x="620" y="102">s</text>
</svg>